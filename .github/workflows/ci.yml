name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm install --no-audit --no-fund
      - run: node --input-type=module -e "await import('@calendoro/sdk'); await import('@calendoro/webhooks'); await import('@calendoro/webhooks/edge')"
      - run: node packages/cli/dist/cli.js --help && node packages/mcp/dist/cli.js --help < /dev/null || true
