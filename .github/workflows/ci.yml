name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm pack --dry-run
      - run: npm install --no-audit --no-fund --no-save --omit=peer && mkdir -p node_modules/@calendoro && ln -sfn "$PWD" node_modules/@calendoro/sdk
      - run: node --input-type=module -e 'await import("@calendoro/sdk")'
